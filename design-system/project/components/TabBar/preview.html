<html>
<head><meta charset="utf-8"><title>TabBar — prévia</title></head>
<body>
<div id="root"></div>
<script>
  var C = window.CasaQuest, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 400, padding: 16 } }, h(C.TabBar, { active: 'missoes', items: [
    { id: 'missoes', label: 'Missões', icon: 'vassoura', badge: 3 }, { id: 'feed', label: 'Feed', icon: 'camera' },
    { id: 'ranking', label: 'Ranking', icon: 'trofeu' }, { id: 'tesouro', label: 'Tesouro', icon: 'bau' }, { id: 'tela', label: 'Tela', icon: 'tela' }] })));
</script>
</body>
</html>
