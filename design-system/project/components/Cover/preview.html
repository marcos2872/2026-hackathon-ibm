<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casa Quest</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-000); color:var(--ink); font-family:var(--font-text); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; shape-rendering:crispEdges; }
  .gold { fill:var(--gold); }
  .shade { fill:var(--gold-shade); }
  .blue { fill:var(--heraldic-blue); }
  .red { fill:var(--heraldic-red); }
  .cyan { fill:var(--cyan); }
  .sq { rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:80px; line-height:.95; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      gold 336×288 frame bled off the top (the brand, largest) · gold-shade 16×288 right edge of the frame (the shield's shading) · heraldic-blue ×2 and heraldic-red ×2 quarters 148×124 · cyan only in the pattern — about 45% of 960×288
  arrangement the logo's quartered shield as a flush modular grid: blue/red over red/blue, cut by an 8px gold cross inside a 16px gold frame
  pattern     a pixel staircase of 8px squares in cyan climbing off the right edge, from "Pixel de verdade… cantos comidos em degrau": the 8-bit diagonal of the crossed broom and sword
  scales      frame space-4 (16), cross and step size space-2 (8), step rise space-5 (24); every corner radius-none
-->
<rect class="gold sq" x="40" y="-16" width="336" height="288"/>
<rect class="shade sq" x="360" y="-16" width="16" height="288"/>
<rect class="blue sq" x="56" y="0" width="148" height="124"/>
<rect class="red sq" x="212" y="0" width="148" height="124"/>
<rect class="red sq" x="56" y="132" width="148" height="124"/>
<rect class="blue sq" x="212" y="132" width="148" height="124"/>
<g class="cyan">
<rect class="sq" x="392" y="256" width="8" height="24"/>
<rect class="sq" x="400" y="232" width="8" height="24"/>
<rect class="sq" x="408" y="208" width="8" height="24"/>
<rect class="sq" x="416" y="184" width="8" height="24"/>
<rect class="sq" x="424" y="160" width="8" height="24"/>
<rect class="sq" x="432" y="136" width="8" height="24"/>
<rect class="sq" x="440" y="112" width="8" height="24"/>
<rect class="sq" x="448" y="88" width="8" height="24"/>
<rect class="sq" x="456" y="64" width="8" height="24"/>
<rect class="sq" x="464" y="40" width="8" height="24"/>
<rect class="sq" x="472" y="16" width="8" height="24"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Casa Quest</h1>
<p class="tag">Tarefas de casa viram missões, e o esforço vira tesouro.</p>
</div>
</div>
</body>
</html>
