<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CasaQuest</title>
<link rel="icon" href="../assets/brand/casa-quest-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade CasaQuest (assets/brand): contorno #1a1c2c, azul heráldico, vermelho heráldico, ouro.
     Layout: simulador de celular à esquerda, roteiro de discussão à direita; empilha no celular. */
  --bg:#ECEEF5;
  --surface:#FFFFFF;
  --surface-2:#F4F5FA;
  --ink:#1A1C2C;
  --muted:#545A72;
  --line:#D7DAE6;
  --accent:#3B5DC9;
  --accent-ink:#F4F4F4;
  --accent-soft:#E2E7F8;
  --brand-night:#29366F;
  --heraldic-red:#B13E53;
  --gold:#FFCD75;
  --gold-deep:#EF7D57;
  --hard:#1A1C2C;
  --good:#1D7A4E; --good-soft:#DCF1E6; --warn:#9A5800; --warn-soft:#FCEBD0; --bad:#B13E53; --bad-soft:#F8E0E5;
  --font-display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151F; --surface:#1F2133; --surface-2:#272A40; --ink:#F4F4F4; --muted:#A6ABC2; --line:#363A55;
    --accent:#7F9BF2; --accent-ink:#1A1C2C; --accent-soft:#2A3566; --hard:#05060C;
    --good:#5ACB92; --good-soft:#163526; --warn:#F2AE5C; --warn-soft:#3B2B12; --bad:#EC7C91; --bad-soft:#3F1C26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14151F; --surface:#1F2133; --surface-2:#272A40; --ink:#F4F4F4; --muted:#A6ABC2; --line:#363A55;
  --accent:#7F9BF2; --accent-ink:#1A1C2C; --accent-soft:#2A3566; --hard:#05060C;
  --good:#5ACB92; --good-soft:#163526; --warn:#F2AE5C; --warn-soft:#3B2B12; --bad:#EC7C91; --bad-soft:#3F1C26;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:700;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img.px,svg.px{image-rendering:pixelated;shape-rendering:crispEdges}

.shell{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto;padding:24px 24px 48px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:1fr;padding:12px 16px 40px;gap:24px}}

/* barra do simulador */
.simbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.simbar-k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-size:13px}
.who button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.who .tag{font-size:10px;font-weight:700;color:var(--heraldic-red);text-transform:uppercase;letter-spacing:.03em}
.simtools{display:flex;gap:8px;flex-wrap:wrap}

.phone{position:relative;background:var(--surface-2);border:3px solid var(--hard);border-radius:26px;overflow:hidden;height:780px;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--hard)}
@media (max-width:900px){.phone{height:min(780px,calc(100dvh - 150px));min-height:560px}}
.app-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--brand-night);color:#F4F4F4}
.app-head img{width:34px;height:34px;border-radius:6px}
.app-head h1{font-size:18px}
.app-head small{display:block;color:#C9D0EE;font-size:12px}
.app-main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:2px solid var(--line)}
.tabbar button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--heraldic-red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px}

/* avatar 8 bits */
.av{width:28px;height:28px;border-radius:6px;display:inline-block;flex:none;background:var(--surface-2);overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:64px;height:64px;border:3px solid var(--hard);border-radius:8px;background:#C9D0EE}

/* painel de status no estilo RPG */
.hero{background:var(--brand-night);color:#F4F4F4;border:3px solid var(--hard);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;box-shadow:0 4px 0 var(--hard)}
.hero h1{font-size:22px}
.hero .sub{font-size:12px;color:#C9D0EE}
.bars{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:74px 1fr auto;gap:8px;align-items:center;font-size:12px}
.bar .k{font-family:var(--font-display);font-size:13px;color:#E6E9F7}
.bar .v{font-variant-numeric:tabular-nums;color:#E6E9F7;min-width:72px;text-align:right}
.track{height:10px;background:#141A3D;border:2px solid var(--hard);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:#1E2856;color:#F4F4F4}
.chip svg{width:14px;height:14px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec .muted{font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0}
.hello h1{font-size:24px}
.hello p{margin:2px 0 0}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{background:var(--surface);border:2px solid var(--line);border-left-width:8px;border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.task.w1{border-left-color:#7FC8A9}.task.w2{border-left-color:var(--gold)}.task.w3{border-left-color:var(--gold-deep)}.task.w4{border-left-color:var(--heraldic-red)}
.task.done{opacity:.75}
.task h3{font-family:var(--font-body);font-size:15px;font-weight:700;letter-spacing:0}
.task .meta{font-size:12px;color:var(--muted);grid-column:1}
.task .why{grid-column:1/-1;font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:6px 8px}
.simples .task h3{font-size:17px}
.simples .task{padding:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

.btn{border:2px solid var(--hard);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:14px;box-shadow:0 3px 0 var(--hard)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--hard)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--hard)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.good{background:#38B764;color:#1A1C2C}
.btn.bad{background:var(--surface);color:var(--bad)}
.btn.gold{background:var(--gold);color:#1A1C2C}
.btn.block{width:100%}
.fab{position:absolute;right:16px;bottom:78px;width:52px;height:52px;border-radius:12px;font-size:28px;line-height:1;padding:0;z-index:3;background:var(--heraldic-red);color:#fff}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px}
.feed img{width:48px;height:36px;object-fit:cover;border-radius:4px}
.feed p{margin:0;font-size:13px}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.photos figcaption{position:absolute;left:6px;top:6px;background:rgba(26,28,44,.8);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.nophoto{grid-column:1/-1;border:2px dashed var(--line);border-radius:6px;padding:12px;text-align:center;color:var(--muted);font-size:13px}
.formula{font-size:13px;color:var(--muted);margin:0}
.formula b{color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.callout{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-soft)}
.callout.good{background:var(--good-soft)}

.slot{display:flex;flex-direction:column;gap:6px}
.slot-k{font-size:12px;font-weight:700}
.slot-k em{font-style:normal;font-weight:500;color:var(--muted)}
.drop{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:6px;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;text-align:center;padding:8px;background:var(--surface)}
.drop:hover{border-color:var(--accent)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=password],select,textarea{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-weight:400;width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tagbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:5px;padding:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* evolução individual: barras semanais */
.evo-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.evo-big{font-family:var(--font-display);font-size:40px;line-height:1}
.chart{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;align-items:end;height:130px;border-bottom:1px solid var(--line);padding-top:18px}
.chart .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;color:var(--muted)}
.chart .grid span{position:absolute;right:0;top:-14px}
.colb{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;outline:none}
.colb i{display:block;width:60%;max-width:30px;background:var(--accent-soft);border-radius:4px 4px 0 0;border:1px solid var(--accent)}
.colb.now i{background:var(--accent)}
.colb .lbl{position:absolute;font-size:11px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;transform:translateY(-16px)}
.colb .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;padding:4px 6px;border-radius:4px;white-space:nowrap;z-index:2}
.colb:hover .tip,.colb:focus .tip{display:block}
.xl{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;font-size:11px;color:var(--muted);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:11px;color:var(--muted);font-weight:600}
.tile b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}

.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:24px auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 12px}
.rank li.me{border-color:var(--accent)}
.rank .pos{font-family:var(--font-display);font-size:20px;color:var(--muted);text-align:center}
.rank li:first-child .pos{color:var(--gold-deep)}
.rank .nm{font-weight:700;font-size:14px}
.rank .sub{font-size:12px;color:var(--muted)}
.rank .pts{font-family:var(--font-display);font-size:18px;text-align:right}
.rank .pts small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted)}
.crest{width:34px;height:34px;border:2px solid var(--hard);border-radius:6px 6px 14px 14px;display:grid;place-items:center;font-family:var(--font-display);color:#fff;font-size:15px}

/* prêmios em grade */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reward{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.reward h3{font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:0}
.reward .meta{font-size:11px;color:var(--muted)}
.cost{display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.cost svg{width:16px;height:16px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold-deep)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:4px 6px;border-bottom:2px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}

.goal-big{font-family:var(--font-display);font-size:32px}
.bigmeter{height:16px;background:var(--line);border:2px solid var(--hard);border-radius:4px;overflow:hidden}
.bigmeter i{display:block;height:100%;background:var(--gold)}
.contrib{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.cbar{position:relative;height:10px;background:var(--line);border-radius:3px}
.cbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.cbar i.low{background:var(--gold-deep)}
.cbar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.conds li::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--gold-deep)}
.conds li.ok::before{background:var(--good)}

/* computador simulado */
.monitor{background:#1A1C2C;border-radius:10px;padding:10px 10px 0;color:#E7EBF3;border:3px solid var(--hard)}
.screen{position:relative;aspect-ratio:16/10;border-radius:4px;overflow:hidden;background:#29366F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}
.screen.locked{background:radial-gradient(circle at 50% 30%,#3B4C8F,#1A1C2C)}
.screen.desk{background:linear-gradient(160deg,#3B5DC9,#29366F);justify-content:flex-start;align-items:stretch;padding:0}
.screen h3{font-size:18px;color:#fff}
.screen p{margin:0;font-size:12px;color:#C9D0EE;max-width:260px}
.win{background:#F4F4F4;border-radius:4px;margin:12px 0 0 12px;width:62%;height:52%;color:#333;font-size:11px;text-align:left}
.win .wbar{background:#D6DBE5;border-radius:4px 4px 0 0;padding:3px 8px;font-weight:700}
.win .body{padding:8px}
.clock{position:absolute;right:8px;top:8px;background:rgba(26,28,44,.85);color:#fff;font-weight:700;font-size:12px;border-radius:4px;padding:4px 8px;font-variant-numeric:tabular-nums}
.clock.warn{background:#EF7D57;color:#1A1C2C}
.soft{position:absolute;inset:0;background:rgba(26,28,44,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.stand{height:14px;width:30%;margin:0 auto;background:#333C57}
.lock-ic{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8}

/* folhas */
.sheet-wrap{position:absolute;inset:0;background:rgba(10,12,22,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;border-top:3px solid var(--hard);padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:1em;margin:0}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--gold);color:#1A1C2C;border:2px solid var(--hard);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;z-index:6;box-shadow:0 4px 0 var(--hard)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}

/* cadastro */
.onb-steps{display:flex;gap:6px}
.onb-steps span{flex:1;height:6px;border-radius:2px;background:var(--line)}
.onb-steps span.on{background:var(--accent)}
.tpl{display:grid;grid-template-columns:auto 1fr 74px;gap:8px;align-items:center;font-size:13px;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:8px 10px}
.tpl select{padding:4px 6px}
.mrow{display:grid;grid-template-columns:1fr 56px 96px;gap:6px;align-items:center}
.mrow input,.mrow select{padding:6px 8px;font-size:13px}

/* guia lateral */
.guide{display:flex;flex-direction:column;gap:24px;max-width:70ch}
.guide .logo{background:var(--brand-night);border:3px solid var(--hard);border-radius:10px;padding:14px 18px;display:inline-flex;box-shadow:0 4px 0 var(--hard)}
.guide .logo img{height:64px;width:auto}
.guide header p{margin:12px 0 0;color:var(--muted);font-size:16px}
.guide h2{font-size:21px;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px}
.steps .n{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);border:2px solid var(--line)}
.steps li.done .n{background:#38B764;border-color:var(--hard);color:#1A1C2C}
.steps p{margin:0;font-size:14px}

/* foto de exemplo desenhada em canvas (antes = sujo, depois = limpo) */
function fotoExemplo(tipo, nome, semente){
  const c = document.createElement('canvas'); c.width = 360; c.height = 270;
  const g = c.getContext('2d'); const rnd = lcg(semente || 7);
  const antes = tipo === 'antes';
  g.fillStyle = antes ? '#C7C0AE' : '#E6F0F3'; g.fillRect(0,0,360,270);
  g.strokeStyle = antes ? '#A39A84' : '#C3D6DD'; g.lineWidth = 2;
  for (let x = 0; x <= 360; x += 45){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,270); g.stroke(); }
  for (let y = 0; y <= 270; y += 45){ g.beginPath(); g.moveTo(0,y); g.lineTo(360,y); g.stroke(); }
  if (antes){
    for (let i = 0; i < 26; i++){
      g.fillStyle = `rgba(${90+rnd()*40|0},${70+rnd()*30|0},${40+rnd()*20|0},${.25+rnd()*.35})`;
      g.beginPath(); g.ellipse(rnd()*360, rnd()*270, 6+rnd()*26, 4+rnd()*16, rnd()*3, 0, 7); g.fill();
    }
  } else {
    g.fillStyle = '#FFFFFF';
    for (let i = 0; i < 9; i++){
      const x = 20+rnd()*320, y = 20+rnd()*200, s = 6+rnd()*10;
      g.beginPath(); g.moveTo(x,y-s); g.lineTo(x+s*.25,y-s*.25); g.lineTo(x+s,y); g.lineTo(x+s*.25,y+s*.25);
      g.lineTo(x,y+s); g.lineTo(x-s*.25,y+s*.25); g.lineTo(x-s,y); g.lineTo(x-s*.25,y-s*.25); g.closePath(); g.fill();
    }
  }
  g.fillStyle = 'rgba(26,28,44,.78)'; g.fillRect(0,226,360,44);
  g.fillStyle = '#fff'; g.font = '600 15px sans-serif';
  g.fillText((antes ? 'ANTES · ' : 'DEPOIS · ') + nome, 12, 253);
  return c.toDataURL('image/jpeg', .72);
}
function lerFoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 480/Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============ sorteio balanceado sem repetição ============ */
function sortear(semente, silencioso){
  const rnd = lcg(semente);
  const dia = hoje();
  const todos = S.membros;
  const doDia = S.atribuicoes.filter(a => a.data === dia);
  const manter = doDia.filter(a => a.status !== 'a_fazer' || a.origem === 'avulsa' || (ativ(a.atividadeId) || {}).pessoal);
  S.atividades.filter(a => a.ativo && a.pessoal).forEach(a => {
    todos.filter(crianca).forEach(m => {
      if (!manter.some(x => x.membroId === m.id && x.atividadeId === a.id))
        manter.push({id:uid('at'), atividadeId:a.id, membroId:m.id, data:dia, status:'a_fazer', origem:'fixa'});
    });
  });
  const sabado = new Date().getDay() === 6;
  const pool = [];
  S.atividades.filter(a => a.ativo && !a.pessoal && !a.avulsa && (!a.semanal || sabado)).forEach(a => {
    const n = a.vezes || 1;
    for (let i = 0; i < n; i++) pool.push({a, rotulo: a.rotulos ? a.rotulos[i] : ''});
  });
  manter.filter(x => x.origem !== 'avulsa' && !(ativ(x.atividadeId) || {}).pessoal).forEach(x => {
    const k = pool.findIndex(p => p.a.id === x.atividadeId && (p.rotulo || '') === (x.rotulo || ''));
    if (k >= 0) pool.splice(k, 1);
  });
  embaralha(pool, rnd);
  pool.sort((p, q) => q.a.peso - p.a.peso);
  const carga = {};
  todos.forEach(m => { carga[m.id] = m.pesoSemana + manter.filter(x => x.membroId === m.id).reduce((s, x) => s + (ativ(x.atividadeId)?.peso || 0), 0); });
  const ordem = embaralha(todos.slice(), rnd);
  const novos = [], semDono = [];
  let repeticoesEvitadas = 0;
  for (const it of pool){
    const jaHoje = id => manter.concat(novos).some(x => x.membroId === id && x.atividadeId === it.a.id);
    let eleg = ordem.filter(m => m.idade >= (it.a.idadeMin || 0));
    if (!eleg.length){ semDono.push(it.a.nome); continue; }
    const semRep = eleg.filter(m => !m.ontem.includes(it.a.id) && !jaHoje(m.id));
    if (semRep.length && semRep.length < eleg.length) repeticoesEvitadas++;
    if (semRep.length) eleg = semRep;
    eleg = eleg.slice().sort((p, q) => carga[p.id] - carga[q.id]);
    const m = eleg[0];
    carga[m.id] += it.a.peso;
    novos.push({id:uid('at'), atividadeId:it.a.id, membroId:m.id, data:dia, status:'a_fazer', rotulo:it.rotulo, origem:'sorteio'});
  }
  const spread = () => { const v = Object.values(carga); const mx = Math.max(...v); return mx ? (mx - Math.min(...v))/mx*100 : 0; };
  let trocas = 0;
  for (let it = 0; it < 8 && spread() > S.config.limiteSorteio; it++){
    const ids = Object.keys(carga).sort((a, b) => carga[b] - carga[a]);
    const mx = ids[0], mn = ids[ids.length-1];
    const cand = novos.filter(x => x.membroId === mx && membro(mn).idade >= (ativ(x.atividadeId).idadeMin || 0) && !membro(mn).ontem.includes(x.atividadeId))
      .filter(x => Math.abs((carga[mx] - ativ(x.atividadeId).peso) - (carga[mn] + ativ(x.atividadeId).peso)) < carga[mx] - carga[mn])
      .sort((a, b) => ativ(b.atividadeId).peso - ativ(a.atividadeId).peso);
    if (!cand.length) break;
    const t = cand[0]; const p = ativ(t.atividadeId).peso;
    carga[mx] -= p; carga[mn] += p; t.membroId = mn; trocas++;
  }
  S.atribuicoes = S.atribuicoes.filter(a => a.data !== dia).concat(manter, novos);
  S.sorteio = {semente, quando:Date.now(), carga, diff: spread(), repeticoesEvitadas, trocas, semDono};
  if (!silencioso) audit('sorteio', `Novo sorteio balanceado (semente ${semente}): diferença de ${fmt(spread())}% entre a maior e a menor carga.`);
}

function resgatesNaSemana(recId){ return S.resgates.filter(x => x.recompensaId === recId && isoLocal(new Date(x.quando)) >= S.semana).length; }
function bloqueioResgate(m, rec){

function pcStart(){
  const m = membro(ui.who); if (m.minutos <= 0) return;

  audit('tempo', `Computador de ${m.nome} desbloqueado com ${m.minutos} min de saldo.`, m.id);
  clearInterval(pcTimer); pcTimer = setInterval(pcTick, 1000); render();
}
function pcStop(msg){
  if (!ui.pc.run) return;
  clearInterval(pcTimer); pcTimer = null;
  const m = membro(ui.pc.owner);
  ui.pc = {run:false, soft:0, owner:null};
  if (m) audit('tempo', `Computador de ${m.nome} ${msg || 'desligado'}.`, m.id);
  save();
}
function pcTick(){
  const m = membro(ui.pc.owner); if (!m){ pcStop(); return; }
  if (ui.pc.soft > 0){
    ui.pc.soft--;
    if (ui.pc.soft === 0){ pcStop('bloqueado: saldo esgotado'); toast('Computador bloqueado'); }
  } else {
    m.minutos = Math.max(0, m.minutos - 1); m.usadoHoje++;
    if (m.minutos === 0) ui.pc.soft = 5;
  }
  if (ui.tab === 'tela' && !ui.sheet) render();
}

const ord = a => ({a_fazer:0, rejeitado:1, contestado:2, pendente:3, aprovado:4})[a.status] ?? 5;

  const atv = ativ(a.atividadeId); if (!atv) return '';
  const r = a.registroId && S.registros.find(x => x.id === a.registroId);
  const max = calcPts(atv.peso, 'antes_depois');
  const w = atv.peso <= .5 ? 1 : atv.peso <= 1 ? 2 : atv.peso <= 2 ? 3 : 4;
  let pill, acao = '', why = '';
  switch (a.status){

      acao = r.final ? `<button class="btn sm ghost" data-act="registrar" data-id="${a.id}">Refazer</button>` : `<button class="btn sm ghost" data-act="contestar" data-id="${r.id}">Contestar</button> <button class="link" data-act="registrar" data-id="${a.id}">Refazer</button>`;
      break;
    default:
      pill = `<span class="pill neutral">A fazer</span>`;
      acao = `<button class="btn sm" data-act="registrar" data-id="${a.id}">Registrar</button>`;
  }
  const extra = a.origem === 'avulsa' ? ` · criada por ${esc(membro(a.criadoPor)?.nome || '')}` : a.origem === 'sorteio' ? ' · sorteada' : a.origem === 'redistribuida' ? ' · redistribuída' : '';
  return `<li class="task w${w} ${a.status === 'aprovado' ? 'done' : ''}">
    <div><h3>${esc(atv.nome)}${a.rotulo && a.rotulo !== 'redistribuída' ? ` <span class="muted" style="font-weight:500">· ${esc(a.rotulo)}</span>` : ''}</h3>
    <div class="meta">Peso ${fmt(atv.peso)} · até ${fmt(max)} pts · ${EVID[atv.evid].label.toLowerCase()} · até ${esc(atv.prazo)}${extra}</div></div>
    <div class="row end">${acao || pill}</div>
    ${acao ? `<div class="meta">${pill}</div>` : ''}
    ${why}
  </li>`;
}

  return `<article class="card">
    <div class="spread"><div class="row">${av(m)}<div><b>${esc(m.nome)}</b> · ${esc(atv.nome)}<br><span class="note">${quando(r.quando)} · ${EVID[r.evid].label.toLowerCase()}</span></div></div>

    ${r.obs ? `<p class="formula">“${esc(r.obs)}”</p>` : ''}
    ${cont ? `<div class="callout warn"><b>Rejeitado antes:</b> ${esc(r.motivo)}<br><b>${esc(m.nome)} contestou:</b> ${esc(r.contestacao)}</div>` : ''}
    <div class="grid2">

      ${q !== 1 ? `<label class="f" for="qj-${r.id}">Justificativa<input type="text" id="qj-${r.id}" data-qj="${r.id}" value="${esc(ui.qj[r.id] || '')}" placeholder="Obrigatória"></label>` : '<span></span>'}

/* ---------- Evolução individual + ranking por equipe ---------- */
function vEvolucao(m){
  const sem = m.semanas; const n = sem.length; const atual = sem[n-1], ant = sem[n-2] || 0;
  const diff = atual - ant; const melhor = Math.max(...sem.slice(0, -1));
  const topo = Math.max(10, ...sem) ; const escala = Math.ceil(topo / 20) * 20;
  const inicioSem = i => addDias(S.semana, -7*(n-1-i));
  const chart = `<div class="chart" role="img" aria-label="Pontos por semana nas últimas ${n} semanas">
      <div class="grid" style="bottom:${50}%"><span>${escala/2}</span></div><div class="grid" style="bottom:100%"><span>${escala}</span></div>
      ${sem.map((v, i) => `<div class="colb ${i === n-1 ? 'now' : ''}" tabindex="0"><i style="height:${Math.max(2, v/escala*100)}%"></i>${i >= n-2 ? `<span class="lbl" style="bottom:${v/escala*100}%">${fmt(v)}</span>` : ''}<span class="tip">Semana de ${dataCurta(inicioSem(i))}: ${fmt(v)} pts</span></div>`).join('')}
    </div>
    <div class="xl">${sem.map((v, i) => `<span>${i === n-1 ? 'esta' : dataCurta(inicioSem(i))}</span>`).join('')}</div>`;
  const eqs = S.equipes.map(e => { const ms = S.membros.filter(x => x.equipe === e.id); return {e, ms, tot: ms.reduce((s, x) => s + x.pts, 0), tar: ms.reduce((s, x) => s + x.tarefasTemp, 0)}; })
    .filter(x => x.ms.length).sort((a, b) => b.tot - a.tot || b.tar - a.tar);
  const dias = Math.max(0, diasEntre(hoje(), S.temporada.fim));
  const metaTot = S.membros.reduce((s, x) => s + (S.meta.contrib[x.id] || 0), 0);
  return `<section class="hello"><h1>Sua evolução</h1><p class="muted">Você contra você mesmo, semana a semana.</p></section>
  <div class="card">
    <div class="evo-top"><span class="evo-big num">${fmt(atual)}</span><span class="muted">pontos nesta semana</span>
      <span class="pill ${diff >= 0 ? 'ok' : 'info'}">${diff >= 0 ? `+${fmt(diff)} sobre a semana passada` : `faltam ${fmt(-diff)} para igualar a semana passada`}</span></div>
    ${chart}
    <p class="note">${atual > melhor ? 'Esta já é a sua melhor semana!' : `Sua melhor semana teve ${fmt(melhor)} pontos.`} A semana fecha no domingo.</p>
  </div>
  <div class="tiles">
    <div class="tile"><span>Sequência</span><b>${m.streak} dias</b></div>
    <div class="tile"><span>Missões na semana</span><b>${m.tarefasSemana}</b></div>
    <div class="tile"><span>Nível</span><b>${nivel(m.xp).n}</b></div>
  </div>
  <h2 class="sec">Ranking por equipe <span class="muted">${esc(S.temporada.nome)} · ${dias} dias</span></h2>
  ${eqs.length > 1 ? `<ol class="rank">${eqs.map((x, i) => `<li class="${x.e.id === m.equipe ? 'me' : ''}"><span class="pos">${i+1}</span><span class="crest" style="background:${x.e.cor}">${esc(x.e.nome.split(' ').pop()[0])}</span><div><div class="nm">${esc(x.e.nome)}${x.e.id === m.equipe ? ' · sua equipe' : ''}</div><div class="sub">${esc(nomes(x.ms.map(y => y.nome)))}</div></div><div class="pts num">${fmt(x.tot)}<small>${x.tar} tarefas</small></div></li>`).join('')}</ol>
  <div class="callout"><b>Prêmio da equipe vencedora:</b> ${esc(eqs[0].e.premio)}. O ranking soma os pontos de temporada da equipe e não compara pessoas.</div>`
  : `<div class="card"><b>${esc(eqs[0]?.e.nome || 'Equipe')}</b><p class="note">Com uma equipe só, o ranking vira a posição em relação à meta coletiva: ${fmt(metaTot)} de ${fmt(S.meta.alvo)} pontos.</p><div class="bigmeter"><i style="width:${Math.min(100, metaTot/S.meta.alvo*100)}%"></i></div></div>`}`;
}

    return `<div class="reward"><h3>${esc(r.nome)}</h3>
      <div class="cost num">${COIN}${fmt(r.custo)}</div>

      <div class="meta">${b ? esc(b) : 'Pode resgatar agora'}${r.estoque != null ? ` · ${Math.max(0, r.estoque - resgatesNaSemana(r.id))}/${r.estoque} na semana` : ''}</div>
      <button class="btn sm ${b ? 'ghost' : 'gold'}" data-act="resgatar" data-id="${r.id}" ${b ? 'disabled' : ''}>Resgatar</button></div>`;

  ${crianca(m) ? `<div class="card"><div class="spread"><b>Mesada da semana</b><span class="cost num">${brl(pago ? pago.valor : mesadaDevida(m))}</span></div>
    <p class="note">${mc.modo === 'fixo' ? `${brl(mc.valor)} se cumprir ${mc.minPct}% das tarefas. Você está em ${Math.round(cumprimento(m)*100)}%.` : `${brl(mc.taxa)} por ponto da semana.`} ${pago ? `Paga via ${esc(pago.metodo)}.` : 'Os admins pagam por Pix ou em dinheiro no fim da semana.'}${antP ? ` Semana passada: ${brl(antP.valor)} pagos.` : ''}</p></div>` : ''}
  <h2 class="sec">${HORIZ.curto} <span class="muted">dia a dia</span></h2>${grupo('curto')}
  <h2 class="sec">${HORIZ.medio} <span class="muted">no mês</span></h2>${grupo('medio')}
  <h2 class="sec">${HORIZ.longo} <span class="muted">trimestre ou ano</span></h2>${grupo('longo')}
  <button class="card" style="text-align:left;cursor:pointer" data-act="tab" data-tab="meta"><b>Meta coletiva: ${esc(S.meta.nome)}</b><span class="note">Todos somam pontos; cada um precisa contribuir com o mínimo. Ver progresso.</span></button>
  ${isAdmin(m.id) ? `<button class="btn ghost" data-act="nova-recompensa">Oferecer recompensa</button>` : ''}
  <h2 class="sec">Extrato <span class="muted">movimentos de pontos</span></h2>
  <div class="card scroll-x"><table class="t"><thead><tr><th>Movimento</th><th class="r">XP</th><th class="r">Créd.</th></tr></thead><tbody>
  ${ext.map(x => `<tr><td>${esc(x.desc)}<br><span class="note">${quando(x.quando)} · ${x.cred < 0 ? 'débito' : 'crédito'}</span></td><td class="r">${x.xp ? '+' + fmt(x.xp) : '—'}</td><td class="r" style="color:${x.cred < 0 ? 'var(--bad)' : 'var(--good)'}">${x.cred > 0 ? '+' : ''}${fmt(x.cred)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sem movimentos ainda.</td></tr>'}
  </tbody></table></div>`;
}

/* ---------- Tela (computador) ---------- */

/* ---------- Meta coletiva ---------- */
function vMeta(m){
  const g = S.meta; const ms = S.membros;
  const tot = ms.reduce((s, x) => s + (g.contrib[x.id] || 0), 0);
  const min = g.alvo * g.minPct / 100;
  const dias = Math.max(0, diasEntre(hoje(), g.prazo)); const decorr = diasEntre(g.inicio, hoje());
  const falta = Math.max(0, g.alvo - tot);
  const abaixo = ms.filter(x => (g.contrib[x.id] || 0) < min);
  const escala = Math.max(min * 2, ...ms.map(x => g.contrib[x.id] || 0)) * 1.1;
  const ritmo = dias ? Math.ceil(falta / dias) : falta;
  const ritmoAtual = decorr ? Math.round(tot / decorr) : 0;
  return `<section class="hello"><h1>${esc(g.nome)}</h1><p class="muted">Meta coletiva · ${dias} dias restantes de ${diasEntre(g.inicio, g.prazo)}</p></section>
  <div class="card">
    <div class="spread"><span class="goal-big num">${fmt(tot)}</span><span class="muted num">de ${fmt(g.alvo)} pontos</span></div>
    <div class="bigmeter" role="img" aria-label="${Math.round(tot/g.alvo*100)}% da meta"><i style="width:${Math.min(100, tot/g.alvo*100)}%"></i></div>
    <p class="formula num">Faltam <b>${fmt(falta)}</b> pontos: <b>${ritmo} por dia</b> a partir de hoje. Ritmo atual: ${ritmoAtual} por dia${ritmoAtual >= ritmo ? ', dentro do prazo.' : ', abaixo do necessário.'}</p>
  </div>
  <h2 class="sec">Contribuição de cada um <span class="muted">mínimo ${fmt(min)} (${g.minPct}%)</span></h2>
  <div class="card">${ms.map(x => { const c = g.contrib[x.id] || 0; return `<div class="contrib"><span>${esc(x.nome)}</span><div class="cbar"><i class="${c < min ? 'low' : ''}" style="width:${c/escala*100}%"></i><span class="mk" style="left:${min/escala*100}%" title="mínimo"></span></div><span class="num" style="text-align:right">${fmt(c)}</span></div>`; }).join('')}
  <p class="note">A linha marca a contribuição mínima. O prêmio só sai com todos acima dela, então ninguém carrega o grupo sozinho.</p></div>
  <h2 class="sec">Para liberar o prêmio</h2>
  <ul class="conds card">
    <li class="${tot >= g.alvo ? 'ok' : ''}">Somar ${fmt(g.alvo)} pontos até ${dataCurta(g.prazo)} (faltam ${fmt(falta)})</li>

/* ============ eventos ============ */
function toast(t){ ui.toast = t; clearTimeout(toastTimer); render(); toastTimer = setTimeout(() => { ui.toast = null; render(); }, 2600); }
function setWho(id){ pcStop('desligado ao trocar de usuário'); ui.who = id; ui.sheet = null; ui.onb = null; }
const errSheet = t => { const e = document.getElementById('sheet-err'); if (e) e.textContent = t; };

const ACT = {
  who: d => { setWho(d.id); render(); },
  tab: d => { if (d.tab !== 'tela') pcStop('desligado ao sair da tela'); ui.tab = d.tab; render(); },
  reset: () => { pcStop(); try { localStorage.removeItem(KEY); } catch(e){} seed(); ui.who = 'm3'; ui.tab = 'hoje'; ui.onb = null; ui.sheet = null; ui.vis = {}; toast('Dados de exemplo restaurados'); },
  onb: () => { pcStop(); ui.onb = onbPadrao('familia'); ui.sheet = null; render(); },
  'onb-tipo': d => { ui.onb = onbPadrao(d.v); render(); },
  'onb-sair': () => { ui.onb = null; render(); },
  'onb-voltar': () => { ui.onb.passo--; render(); },
  'onb-avancar': () => {
    const o = ui.onb;
    if (o.passo === 1 && !o.familia.trim()) return errSheet('Dê um nome para o grupo.');
    if (o.passo === 2 && o.atv.filter(a => a.on).length < 3) return errSheet('Escolha pelo menos 3 atividades.');
    if (o.passo < 3){ o.passo++; render(); return; }
    const ms = o.membros.filter(m => m.nome.trim());
    if (o.tipo === 'casal'){ if (ms.length !== 2) return errSheet('No casal, cadastre as duas pessoas.'); ms.forEach(m => { m.admin = true; }); }
    else {
      if (ms.length < 2) return errSheet('Cadastre pelo menos 2 pessoas.');
      if (!ms.some(m => m.admin && +m.idade >= 18)) return errSheet('Marque pelo menos um adulto como admin.');
    }
    seed({tipo:o.tipo, familia:o.familia, atividades:o.atv.filter(a => a.on), membros:ms, historico:o.historico, criadaAgora:true});
    ui.onb = null; ui.who = admins()[0].id; ui.tab = 'admin'; ui.vis = {};
    toast(`${S.familia.nome} criada e tarefas do dia sorteadas`);
  },
  go: d => {
    const bruno = S.tipo === 'familia' ? S.membros[2] : null;
    ui.onb = null; ui.sheet = null;
    if (!bruno && S.tipo !== 'familia'){ toast('O roteiro usa a família de exemplo. Clique em “Restaurar exemplo”.'); return; }
    if (d.go === 'p1' && bruno){ setWho(bruno.id); ui.tab = 'hoje'; }
    if (d.go === 'p2' && bruno){
      const atb = S.atribuicoes.find(a => a.membroId === bruno.id && a.atividadeId === 'banheiro');
      const r = atb && atb.registroId && S.registros.find(x => x.id === atb.registroId);
      if (r && r.status === 'pendente'){ setWho(admins()[0].id); ui.tab = 'admin'; } else { setWho(bruno.id); ui.tab = 'hoje'; }
    }
    if (d.go === 'p3' && bruno){ setWho(bruno.id); ui.tab = 'evolucao'; }
    if (d.go === 'p4' && bruno){ setWho(bruno.id); ui.tab = 'premios'; }
    if (d.go === 'p5' && bruno){ setWho(bruno.id); ui.tab = 'meta'; }
    render();
    if (window.matchMedia('(max-width:900px)').matches) document.getElementById('stage').scrollIntoView({behavior:'smooth'});
  },
  registrar: d => { ui.draft = {atribId:d.id, antes:null, depois:null, obs:''}; ui.sheet = {t:'registrar'}; render(); },
  'foto-exemplo': d => { const a = S.atribuicoes.find(x => x.id === ui.draft.atribId); ui.draft[d.k] = fotoExemplo(d.k, ativ(a.atividadeId).nome, d.k === 'antes' ? 41 : 42); render(); },
  'limpar-foto': d => { ui.draft[d.k] = null; render(); },
  enviar: () => enviarRegistro(),
  fechar: () => { ui.sheet = null; ui.draft = null; render(); },
  aprovar: d => aprovar(d.id),
  rejeitar: d => { ui.sheet = {t:'rejeitar', id:d.id}; render(); },
  'motivo-rapido': d => { const t = document.getElementById('motivo'); if (t) t.value = d.v; },
  'confirmar-rejeicao': d => { const v = document.getElementById('motivo').value.trim(); if (!v) return errSheet('Escreva o motivo da rejeição.'); rejeitar(d.id, v); },
  contestar: d => { ui.sheet = {t:'contestar', id:d.id}; render(); },
  'confirmar-contestacao': d => { const v = document.getElementById('cont').value.trim(); if (!v) return errSheet('Explique por que a tarefa foi feita.'); contestar(d.id, v); },
  resgatar: d => { ui.sheet = {t:'resgatar', id:d.id}; render(); },
  'confirmar-resgate': d => resgatar(d.id),
  converter: () => converter(),
  'pc-start': () => pcStart(),
  'pc-stop': () => { pcStop('desligado com saldo guardado'); render(); },
  sortear: () => { sortear(Math.floor(Math.random()*1e6)+1); save(); toast(`Novo sorteio: diferença de ${fmt(S.sorteio.diff)}%`); },
  'nao-feita': d => naoFeita(d.id),
  pagar: d => pagarMesada(d.id, d.m),
  'mesada-modo': d => { S.config.mesada.modo = d.v; audit('mesada', `${membro(ui.who).nome} mudou a mesada para ${d.v === 'fixo' ? 'valor fixo' : 'conversão de pontos'}.`); save(); render(); },
  emergencia: () => { ui.sheet = {t:'emergencia'}; render(); },
  'confirmar-emergencia': () => {
    const mid = document.getElementById('em-m').value, min = +document.getElementById('em-min').value, j = document.getElementById('em-j').value.trim(), pin = document.getElementById('em-pin').value;
    if (!j) return errSheet('A justificativa é obrigatória (RN11).');
    if (pin !== S.config.pin) return errSheet('PIN incorreto.');
    const m = membro(mid); m.minutos += min;
    audit('emergência', `${membro(ui.who).nome} liberou ${min} min para ${m.nome} com PIN: ${j}.`);
    ui.sheet = null; save(); toast(`+${min} min de emergência para ${m.nome}`);
  },
  atividades: () => { ui.sheet = {t:'atividades'}; render(); },
  'nova-tarefa': () => { ui.sheet = {t:'nova-tarefa'}; render(); },
  'salvar-tarefa': () => {
    const nome = document.getElementById('nt-nome').value.trim();
    if (!nome) return errSheet('Dê um título para a tarefa.');
    const para = document.getElementById('nt-para').value, peso = +document.getElementById('nt-peso').value, evid = document.getElementById('nt-evid').value;
    const a = {id:uid('a'), nome, peso, freq:'Avulsa', evid, valid:'admin', idadeMin:0, prazo:'hoje', ativo:false, avulsa:true};
    S.atividades.push(a);
    S.atribuicoes.push({id:uid('at'), atividadeId:a.id, membroId:para, data:hoje(), status:'a_fazer', origem:'avulsa', criadoPor:ui.who});
    audit('tarefa', `${membro(ui.who).nome} criou “${nome}” (peso ${fmt(peso)}) para ${para === ui.who ? 'si' : membro(para).nome}.`);
    ui.sheet = null; save(); toast(para === ui.who ? 'Tarefa criada para você' : `Tarefa atribuída a ${membro(para).nome}`);
  },
  'nova-recompensa': () => { ui.sheet = {t:'recompensa'}; render(); },
  'salvar-recompensa': () => {
    const nome = document.getElementById('nr-nome').value.trim(); const custo = +document.getElementById('nr-custo').value;
    if (!nome || !(custo > 0)) return errSheet('Preencha nome e custo.');
    const est = +document.getElementById('nr-est').value; const min = +document.getElementById('nr-min').value;
    S.recompensas.push({id:uid('r'), nome, custo, horizonte:document.getElementById('nr-h').value, estoque: est > 0 ? est : null, minutos: min > 0 ? min : undefined, por:ui.who});
    audit('recompensa', `${membro(ui.who).nome} ofereceu a recompensa “${nome}” (${custo} créditos).`);
    ui.sheet = null; save(); toast('Recompensa oferecida');
  },
  'fechar-fundo': (d, el, ev) => { if (ev.target === el){ ui.sheet = null; ui.draft = null; render(); } }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'fechar-fundo') ev.preventDefault();
  fn(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.draft && ui.draft) ui.draft[t.dataset.draft] = t.value;
  if (t.dataset.qj) ui.qj[t.dataset.qj] = t.value;
  if (t.dataset.onb === 'familia') ui.onb.familia = t.value;
  if (t.dataset.onbM != null && t.type !== 'checkbox' && t.tagName !== 'SELECT') ui.onb.membros[+t.dataset.onbM][t.dataset.k] = t.value;
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.file && ui.draft && t.files && t.files[0]){
    try { ui.draft[t.dataset.file] = await lerFoto(t.files[0]); } catch(e){ toast('Não consegui ler essa imagem. Tente outra.'); return; }
    render(); return;
  }
  if (t.dataset.quali){ ui.quali[t.dataset.quali] = +t.value; render(); return; }
  if (t.dataset.cfg){ S.config[t.dataset.cfg] = +t.value; audit('regra', `${membro(ui.who).nome} alterou “${t.dataset.cfg}”.`); save(); render(); return; }
  if (t.dataset.peso){ const a = ativ(t.dataset.peso); const antes = a.peso; a.peso = +t.value; audit('peso', `${membro(ui.who).nome} mudou o peso de “${a.nome}” de ${fmt(antes)} para ${fmt(a.peso)}.`); save(); render(); return; }
  if (t.dataset.ativo){ const a = ativ(t.dataset.ativo); a.ativo = t.checked; sortear(Math.floor(Math.random()*1e6)+1); save(); render(); return; }
  if (t.dataset.onb === 'historico'){ ui.onb.historico = t.checked; return; }
  if (t.dataset.onbAtv != null){ const a = ui.onb.atv[+t.dataset.onbAtv]; a[t.dataset.k] = t.type === 'checkbox' ? t.checked : (t.dataset.k === 'peso' ? +t.value : t.value); return; }
  if (t.dataset.onbM != null){ const m = ui.onb.membros[+t.dataset.onbM]; m[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; return; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheet){ ui.sheet = null; ui.draft = null; render(); } });

/* ============ início ============ */
S = load();
if (!S) seed();
else if (S.dia !== hoje()){
  S.membros.forEach(m => { m.ontem = S.atribuicoes.filter(a => a.membroId === m.id && a.data === S.dia && !(ativ(a.atividadeId) || {}).pessoal).map(a => a.atividadeId); m.usadoHoje = 0; });
  if (segunda() !== S.semana){ S.membros.forEach(m => { m.semanas = m.semanas.slice(1).concat(0); m.tarefasSemana = 0; m.atribSemana = 0; }); S.semana = segunda(); }
  S.dia = hoje(); sortear(Math.floor(Math.random()*1e6)+1); save();
}
ui.who = (S.membros[2] || S.membros[0]).id; ui.tab = 'hoje';
render();
</script>
</body>
</html>
