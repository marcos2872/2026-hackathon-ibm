<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20223a">
<title>CasaQuest</title>
<link rel="icon" href="../design-system/project/assets/Logos/casa-quest-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../design-system/project/components/bundle.css">
<style>
/* Tokens do design system Casa Quest (design-system/project/tokens.json), temas Noite (padrão) e Dia. */
:root, [data-theme='noite'] { --surface-000: #20223a; --surface-100: #2b2e4a; --surface-200: #3a3f63; --ink: #f4f4f4; --ink-muted: #b4c0d4; --outline: #0e0f1a; --gold: #ffcd75; --gold-shade: #ef7d57; --on-gold: #1a1c2c; --gold-ink: #ffcd75; --heraldic-blue: #3b5dc9; --heraldic-blue-shade: #29366f; --heraldic-blue-bright: #5b8cf0; --on-blue: #f4f4f4; --blue-ink: #8fb3ff; --heraldic-red: #b13e53; --heraldic-red-shade: #7a2840; --on-red: #f4f4f4; --red-ink: #ff8a9d; --rose: #e26d84; --cyan: #41a6f6; --on-cyan: #1a1c2c; --cyan-ink: #73d4ff; --success: #38b764; --on-success: #1a1c2c; --green-ink: #7fe0a0; --dispute: #7a4a9e; --on-dispute: #f4f4f4; --bar-empty: #14152a; --dialog-bg: #1a1c2c; --dialog-ink: #f4f4f4; --dialog-accent: #ffcd75; --focus: #73eff7; --shadow-bevel: inset -4px -4px 0 0 rgba(0,0,0,0.28), inset 4px 4px 0 0 rgba(255,255,255,0.35); --shadow-pressed: inset 4px 4px 0 0 rgba(0,0,0,0.28); --shadow-drop: 4px 4px 0 0 #0e0f1a; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-8: 48px; --radius-none: 0px; --notch: 4px; --notch-lg: 8px; --font-display: "Press Start 2P", ui-monospace, monospace; --font-text: "Pixelify Sans", system-ui, sans-serif; color-scheme: dark; }
[data-theme='dia'] { --surface-000: #f2e8d5; --surface-100: #fbf5e9; --surface-200: #e6d7b9; --ink: #1a1c2c; --ink-muted: #5a5470; --outline: #1a1c2c; --gold-ink: #8a4f10; --blue-ink: #2c47a8; --red-ink: #9c2f45; --cyan-ink: #17648f; --green-ink: #186b3b; --bar-empty: #d8c8a6; --focus: #2c47a8; --shadow-drop: 4px 4px 0 0 #1a1c2c; color-scheme: light; }

/* Layout do protótipo: simulador de celular à esquerda e roteiro do pitch à direita; #app mostra só o celular. */
html, body { height: 100%; }
#root { min-height: 100%; background: var(--surface-000); color: var(--ink); font-family: var(--font-text); }
.px-frame { box-shadow: 0 -4px 0 0 var(--outline), 0 4px 0 0 var(--outline), -4px 0 0 0 var(--outline), 4px 0 0 0 var(--outline); }
.px-frame-2 { box-shadow: 0 -2px 0 0 var(--outline), 0 2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.t-xl { font-family: var(--font-display); font-size: 24px; line-height: 32px; }
.t-lg { font-family: var(--font-display); font-size: 16px; line-height: 24px; }
.t-md { font-family: var(--font-display); font-size: 12px; line-height: 16px; text-transform: uppercase; }
.lbl { font-family: var(--font-display); font-size: 10px; line-height: 16px; }
.micro { font-family: var(--font-display); font-size: 8px; line-height: 12px; text-transform: uppercase; }
.cap { font-size: 13px; line-height: 16px; color: var(--ink-muted); }
.muted { color: var(--ink-muted); }
.gold { color: var(--gold-ink); }
.green { color: var(--green-ink); }
.red { color: var(--red-ink); }
.cyan { color: var(--cyan-ink); }
p { margin: 0; }
.ic { display: inline-block; flex: none; image-rendering: pixelated; vertical-align: middle; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

.shell { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: var(--space-6); max-width: 1220px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-8); align-items: start; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; padding: var(--space-3) var(--space-4) var(--space-6); gap: var(--space-5); } }

.simbar { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
.who { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: 4px; }
.who button { display: flex; align-items: center; gap: var(--space-2); border: 0; padding: 2px var(--space-2) 2px 2px; cursor: pointer; background: var(--surface-100); color: var(--ink); font: inherit; font-size: 14px; box-shadow: 0 -2px 0 0 var(--outline), 0 2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); }
.who button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); font-weight: 600; }
.who .adm { font-family: var(--font-display); font-size: 7px; }
.tools { display: flex; flex-wrap: wrap; gap: var(--space-1); }

/* celular */
.phone { position: relative; display: flex; flex-direction: column; height: 800px; background: var(--surface-000); overflow: hidden; margin: 4px; }
@media (max-width: 900px) { .phone { height: min(800px, calc(100dvh - 170px)); min-height: 580px; } }
.app-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); background: var(--heraldic-blue-shade); color: var(--on-blue); border-bottom: 4px solid var(--outline); }
.app-head .fam { flex: 1; min-width: 0; }
.app-head .fam b { display: block; font-family: var(--font-display); font-size: 10px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-head .fam span { font-size: 13px; line-height: 16px; color: #c9d0ee; }
.app-head .me { border: 0; padding: 0; background: none; cursor: pointer; }
.app-main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-3) var(--space-5); }
.app-main > * { flex-shrink: 0; } /* sem isso, blocos com overflow (o extrato) encolhem e ficam cortados */
.app-main > .cq-hero { margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0; }
.cq-section-label { margin: var(--space-3) 4px var(--space-1); display: flex; justify-content: space-between; gap: var(--space-2); }
.cq-section-label span { font-family: var(--font-text); font-size: 13px; text-transform: none; color: var(--ink-muted); }
.cq-tabbar .ic { opacity: .55; }
.cq-tab.is-active .ic { opacity: 1; }

/* avatar 8 bits dentro da moldura do DS */
.av { display: inline-grid; place-items: center; width: 28px; height: 28px; background: var(--heraldic-blue); flex: none; }
.av svg { width: 100%; height: 100%; display: block; }
.cq-hero-avatar .av { width: 64px; height: 64px; }
.app-head .av { width: 32px; height: 32px; box-shadow: 0 -2px 0 0 var(--outline), 0 2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); }

/* missões */
.quest-wrap { display: flex; flex-direction: column; }
.quest-extra { margin: 0 4px 4px; padding: var(--space-2) var(--space-3); background: var(--surface-200); font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: var(--space-1); }
.quest-extra .row { display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }
.cq-peso-1_5 .cq-quest-go { background: var(--gold); }
.cq-quest-go[aria-disabled="true"] { background: var(--success); cursor: default; }
.cq-quest-pendente .cq-quest-go, .cq-quest-contestado .cq-quest-go { background: var(--surface-200); }
.cq-quest-rejeitado .cq-quest-go { background: var(--surface-200); }

/* cartões e listas locais, sempre com a moldura pixel */
.card { margin: 4px; padding: var(--space-3); background: var(--surface-100); display: flex; flex-direction: column; gap: var(--space-2); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.feed li { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2); background: var(--surface-100); margin: 0 4px; font-size: 14px; line-height: 20px; }
.feed img { width: 48px; height: 36px; object-fit: cover; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.photos figure { margin: 0; position: relative; }
.photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.photos figcaption { position: absolute; left: 4px; top: 4px; }
.nophoto { grid-column: 1 / -1; padding: var(--space-3); text-align: center; background: var(--surface-200); color: var(--ink-muted); font-size: 14px; }
.formula { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.formula b { color: var(--ink); font-weight: 600; }
.split { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.row { display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }

/* formulários (o DS ainda não tem campos: mesma moldura e superfícies) */
label.f { display: flex; flex-direction: column; gap: var(--space-1); font-size: 14px; font-weight: 600; }
input[type=text], input[type=number], input[type=password], select, textarea { width: 100%; margin: 2px 0; padding: var(--space-2); border: 0; background: var(--surface-000); color: var(--ink); font: inherit; font-size: 16px; box-shadow: 0 -2px 0 0 var(--outline), 0 2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); border-radius: 0; }
textarea { min-height: 72px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2) var(--space-3); }
.check { display: flex; gap: var(--space-2); align-items: flex-start; font-size: 14px; line-height: 20px; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--gold); }
.seg { display: flex; gap: 4px; margin: 4px; padding: 4px; background: var(--surface-000); }
.seg button { flex: 1; border: 0; padding: var(--space-2); background: transparent; color: var(--ink-muted); font-family: var(--font-display); font-size: 8px; line-height: 12px; text-transform: uppercase; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.stars { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.stars .f-k { font-size: 14px; font-weight: 600; margin-right: var(--space-2); }
.stars .cap { margin-left: var(--space-2); }
.star { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: none; cursor: pointer; }
.star .ic { opacity: .3; filter: grayscale(1); }
.star.on .ic { opacity: 1; filter: none; }
.err { color: var(--red-ink); font-size: 14px; font-weight: 600; min-height: 1em; }
.drop { display: grid; place-items: center; gap: var(--space-1); aspect-ratio: 4/3; background: var(--surface-000); color: var(--gold-ink); cursor: pointer; text-align: center; padding: var(--space-2); font-size: 14px; font-weight: 600; margin: 2px; box-shadow: 0 -2px 0 0 var(--outline), 0 2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.slot { display: flex; flex-direction: column; gap: var(--space-1); font-size: 14px; }
.cq-btn-ghost.sm-link { height: auto; padding: 0; margin: 0; font-family: var(--font-text); font-size: 14px; text-transform: none; }

/* tabelas */
table.t { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
table.t th { text-align: left; padding: var(--space-1) var(--space-2); font-family: var(--font-display); font-size: 8px; line-height: 12px; text-transform: uppercase; color: var(--ink-muted); border-bottom: 4px solid var(--outline); font-weight: 400; }
table.t td { padding: var(--space-2); border-bottom: 2px solid var(--surface-200); vertical-align: top; }
table.t .r { text-align: right; }
.scroll-x { overflow-x: auto; }

/* evolução: barras semanais em pixel */
.evo-big { font-family: var(--font-display); font-size: 24px; line-height: 32px; color: var(--ink); }
.chart { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; align-items: end; height: 132px; padding-top: 20px; border-bottom: 4px solid var(--outline); }
.chart .grid { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--surface-200); }
.chart .grid span { position: absolute; right: 0; top: -14px; font-family: var(--font-display); font-size: 7px; color: var(--ink-muted); }
.colb { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; outline: none; }
.colb i { display: block; width: 60%; max-width: 28px; background: var(--surface-200); box-shadow: 0 -2px 0 0 var(--outline), -2px 0 0 0 var(--outline), 2px 0 0 0 var(--outline); }
.colb.now i { background: var(--heraldic-blue-bright); }
.colb .v { position: absolute; font-family: var(--font-display); font-size: 8px; color: var(--ink); transform: translateY(-14px); }
.colb .tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--dialog-bg); color: var(--dialog-ink); font-size: 13px; padding: 4px 6px; white-space: nowrap; z-index: 2; }
.colb:hover .tip, .colb:focus .tip { display: block; }
.xl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; font-size: 12px; color: var(--ink-muted); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); padding: 0 4px; }
.tile { padding: var(--space-2); background: var(--surface-100); display: flex; flex-direction: column; gap: var(--space-1); margin: 4px 0; }
.tile span { font-size: 13px; line-height: 16px; color: var(--ink-muted); }
.tile b { font-family: var(--font-display); font-size: 12px; line-height: 16px; font-weight: 400; }

/* tesouro */
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.rgrid .cq-reward { width: auto; }
.cq-reward-falta { font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* ranking por equipe */
.team-crest { display: grid; place-items: center; width: 32px; height: 32px; font-family: var(--font-display); font-size: 12px; color: var(--on-blue); border: 2px solid var(--outline); box-sizing: border-box; }

/* meta coletiva: quinta cor de membro, quando houver */
.cq-m4 { background: var(--heraldic-blue-bright); }
.cq-goal-track { position: relative; }
.cq-goal-track .mk { position: absolute; top: -4px; bottom: -4px; width: 4px; background: var(--ink); }

/* computador simulado */
.monitor { margin: 4px; padding: var(--space-2) var(--space-2) 0; background: var(--dialog-bg); }
.screen { position: relative; aspect-ratio: 16/10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-3); text-align: center; background: var(--heraldic-blue-shade); color: var(--on-blue); }
.screen.desk { background: var(--heraldic-blue); justify-content: flex-start; align-items: stretch; padding: 0; }
.screen p { font-size: 14px; line-height: 20px; color: #c9d0ee; max-width: 260px; }
.win { margin: var(--space-3) 0 0 var(--space-3); width: 62%; height: 52%; background: #f4f4f4; color: #1a1c2c; font-size: 13px; text-align: left; box-shadow: 0 -2px 0 0 #0e0f1a, 0 2px 0 0 #0e0f1a, -2px 0 0 0 #0e0f1a, 2px 0 0 0 #0e0f1a; }
.win .wbar { background: #94b0c2; padding: 2px var(--space-2); font-weight: 600; }
.win .body { padding: var(--space-2); }
.clock { position: absolute; right: var(--space-2); top: var(--space-2); display: inline-flex; gap: var(--space-1); align-items: center; padding: 2px var(--space-2); background: var(--dialog-bg); color: var(--cyan-ink); font-family: var(--font-display); font-size: 10px; }
.clock.warn { background: var(--gold); color: var(--on-gold); }
.soft { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-3); background: var(--dialog-bg); }
.soft.bar { inset: auto var(--space-2) var(--space-2) var(--space-2); background: var(--gold); color: var(--on-gold); padding: var(--space-2); }
.stand { height: 12px; width: 30%; margin: 0 auto; background: #333c57; }

/* folha (diálogo) e aviso */
.sheet-wrap { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; background: rgba(14,15,26,.6); }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); background: var(--surface-100); border-top: 4px solid var(--outline); }
.toast { position: absolute; left: var(--space-3); right: var(--space-3); bottom: 92px; z-index: 6; }
.fab { position: absolute; right: var(--space-4); bottom: 96px; z-index: 3; }

/* cadastro */
.steps-bar { display: flex; gap: 4px; padding: 0 4px; }
.steps-bar span { flex: 1; height: 8px; background: var(--bar-empty); }
.steps-bar span.on { background: var(--gold); }
.tpl { display: grid; grid-template-columns: auto 1fr 72px; gap: var(--space-2); align-items: center; margin: 4px; padding: var(--space-2); background: var(--surface-100); font-size: 14px; line-height: 20px; }
.tpl select { padding: 4px; }
.mrow { display: grid; grid-template-columns: 1fr 64px 104px; gap: var(--space-2); align-items: center; }

/* guia lateral = roteiro do pitch */
.guide { display: flex; flex-direction: column; gap: var(--space-4); max-width: 74ch; font-size: 16px; line-height: 24px; }
.guide .logo { align-self: flex-start; margin: 4px; padding: var(--space-3) var(--space-4); background: var(--heraldic-blue-shade); }
.guide .logo img { display: block; height: 72px; width: auto; image-rendering: pixelated; }
.guide ul.dots { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--space-1); }
.guide .cq-panel-body { display: flex; flex-direction: column; gap: var(--space-3); }
.demo-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.demo-steps li { display: grid; grid-template-columns: 32px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); background: var(--surface-200); }
.demo-steps .n { display: grid; place-items: center; width: 32px; height: 32px; background: var(--surface-000); font-family: var(--font-display); font-size: 10px; border: 2px solid var(--outline); box-sizing: border-box; }
.demo-steps li.done .n { background: var(--success); }
.demo-steps p { font-size: 16px; line-height: 22px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-2); }
.kpi { margin: 4px; padding: var(--space-3); background: var(--surface-200); display: flex; flex-direction: column; gap: var(--space-1); }
.kpi b { font-family: var(--font-display); font-size: 14px; line-height: 20px; font-weight: 400; color: var(--gold-ink); }
.kpi span { font-size: 14px; line-height: 18px; color: var(--ink-muted); }
.arch { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: 14px; }
.arch .node { margin: 4px; padding: var(--space-1) var(--space-2); background: var(--surface-000); }
.arch .to { color: var(--ink-muted); font-family: var(--font-display); font-size: 10px; }
.map { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 22px; }
.map td { padding: var(--space-2); border-bottom: 2px solid var(--surface-200); vertical-align: top; }
.map td:first-child { width: 34%; font-weight: 600; }
.cut { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
@media (max-width: 560px) { .cut, .grid2 { grid-template-columns: 1fr; } }
code { font-family: ui-monospace, monospace; font-size: 13px; background: var(--surface-000); padding: 1px 4px; }

/* modo só o app (#app): o celular ocupa a tela, sem o roteiro */
body.only-app .guide, body.only-app .simbar { display: none; }
body.only-app .shell { display: flex; justify-content: center; padding: var(--space-4); max-width: none; }
body.only-app #stage { width: min(438px, 100%); min-width: 0; }
body.only-app .phone { width: auto; height: calc(100dvh - 40px); }
@media (max-width: 600px) {
  body.only-app .shell { padding: 0; }
  body.only-app #stage { width: 100%; }
  body.only-app .phone { height: 100dvh; margin: 0; box-shadow: none; }
  body.only-app .app-head { padding-top: max(var(--space-2), env(safe-area-inset-top)); }
  body.only-app .cq-tabbar { padding-bottom: env(safe-area-inset-bottom); }
}
@media (prefers-reduced-motion: no-preference) { .toast, .sheet { animation: cq-sobe .2s steps(3) both; } @keyframes cq-sobe { from { transform: translateY(12px); } to { transform: none; } } }
</style>
</head>
<body>
<div id="root" data-theme="noite">
  <div class="shell">
    <section id="stage" aria-label="Simulador do aplicativo"></section>
    <aside class="guide" id="guide"></aside>
  </div>
</div>

<script>
'use strict';
/* caminho do design system; o restante dos assets sai daqui */
const DS = '../design-system/project/';
const icon = (name, size = 24, alt = '') => `<img class="ic" src="${DS}assets/Icones/${name}.svg" width="${size}" height="${size}" alt="${alt}"${alt ? '' : ' aria-hidden="true"'}>`;
const logo = (name, h, alt) => `<img src="${DS}assets/Logos/${name}.svg" height="${h}" alt="${alt || ''}" style="image-rendering:pixelated">`;

/* ============ constantes e utilitários ============ */

const AV_MAP = ['...oooooo...','..ohhhhhho..','.ohhhhhhhho.','.ohssssssho.','.osessssesо.','.ossssssssо.','..ossmmsso..','...oooooo...','..occccccо..','.occccccccо.','.occccccccо.','.oooooooooo.'].map(r => r.replace(/[^.ohsemc]/g, 'o'));

/* foto de exemplo desenhada em canvas (antes = sujo, depois = limpo) */
function fotoExemplo(tipo, nome, semente){
  const c = document.createElement('canvas'); c.width = 360; c.height = 270;
  const g = c.getContext('2d'); const rnd = lcg(semente || 7);
  const antes = tipo === 'antes';
  g.fillStyle = antes ? '#c7c0ae' : '#e4ecf2'; g.fillRect(0,0,360,270);
  g.strokeStyle = antes ? '#a39a84' : '#94b0c2'; g.lineWidth = 2;
  for (let x = 0; x <= 360; x += 45){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,270); g.stroke(); }
  for (let y = 0; y <= 270; y += 45){ g.beginPath(); g.moveTo(0,y); g.lineTo(360,y); g.stroke(); }
  if (antes){
    for (let i = 0; i < 26; i++){
      g.fillStyle = `rgba(${90+rnd()*40|0},${70+rnd()*30|0},${40+rnd()*20|0},${.25+rnd()*.35})`;
      g.beginPath(); g.ellipse(rnd()*360, rnd()*270, 6+rnd()*26, 4+rnd()*16, rnd()*3, 0, 7); g.fill();
    }
  } else {
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 9; i++){
      const x = 20+rnd()*320|0, y = 20+rnd()*200|0, s = 4 + (rnd()*3|0)*2;
      g.fillRect(x-s, y-2, s*2, 4); g.fillRect(x-2, y-s, 4, s*2);
    }
  }
  g.fillStyle = '#1a1c2c'; g.fillRect(0,226,360,44);
  g.fillStyle = '#f4f4f4'; g.font = '600 15px sans-serif';
  g.fillText((antes ? 'ANTES · ' : 'DEPOIS · ') + nome, 12, 253);
  return c.toDataURL('image/jpeg', .72);
}
function lerFoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 480/Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function avaliadorPara(atr){
  const atv = ativ(atr.atividadeId);
  if (atv.valid === 'auto') return 'auto';
  if (atr.criadoPor && atr.criadoPor !== atr.membroId) return atr.criadoPor;
  if (admins().some(a => a.id !== atr.membroId)) return null;
  const outro = S.membros.filter(x => x.id !== atr.membroId).sort((a, b) => b.idade - a.idade)[0];
  return outro ? outro.id : null;
}

/* ============ sorteio balanceado sem repetição ============ */
function sortear(semente, silencioso){
  const rnd = lcg(semente);
  const dia = hoje();
  const todos = S.membros;
  const manter = S.atribuicoes.filter(a => a.data === dia).filter(a => a.status !== 'a_fazer' || a.origem === 'avulsa' || (ativ(a.atividadeId) || {}).pessoal);
  S.atividades.filter(a => a.ativo && a.pessoal).forEach(a => {
    todos.filter(crianca).forEach(m => {
      if (!manter.some(x => x.membroId === m.id && x.atividadeId === a.id))
        manter.push({id:uid('at'), atividadeId:a.id, membroId:m.id, data:dia, status:'a_fazer', origem:'fixa'});
    });
  });
  const sabado = new Date().getDay() === 6;
  const pool = [];
  S.atividades.filter(a => a.ativo && !a.pessoal && !a.avulsa && (!a.semanal || sabado)).forEach(a => {
    for (let i = 0; i < (a.vezes || 1); i++) pool.push({a, rotulo: a.rotulos ? a.rotulos[i] : ''});
  });
  manter.filter(x => x.origem !== 'avulsa' && !(ativ(x.atividadeId) || {}).pessoal).forEach(x => {
    const k = pool.findIndex(p => p.a.id === x.atividadeId && (p.rotulo || '') === (x.rotulo || ''));
    if (k >= 0) pool.splice(k, 1);
  });
  embaralha(pool, rnd);
  pool.sort((p, q) => q.a.peso - p.a.peso);
  const carga = {};
  todos.forEach(m => { carga[m.id] = m.pesoSemana + manter.filter(x => x.membroId === m.id).reduce((s, x) => s + (ativ(x.atividadeId)?.peso || 0), 0); });
  const ordem = embaralha(todos.slice(), rnd);
  const novos = [];
  let repeticoesEvitadas = 0;
  for (const it of pool){
    const jaHoje = id => manter.concat(novos).some(x => x.membroId === id && x.atividadeId === it.a.id);
    let eleg = ordem.filter(m => m.idade >= (it.a.idadeMin || 0));
    if (!eleg.length) continue;
    const semRep = eleg.filter(m => !m.ontem.includes(it.a.id) && !jaHoje(m.id));
    if (semRep.length && semRep.length < eleg.length) repeticoesEvitadas++;
    if (semRep.length) eleg = semRep;
    const m = eleg.slice().sort((p, q) => carga[p.id] - carga[q.id])[0];
    carga[m.id] += it.a.peso;
    novos.push({id:uid('at'), atividadeId:it.a.id, membroId:m.id, data:dia, status:'a_fazer', rotulo:it.rotulo, origem:'sorteio'});
  }
  const spread = () => { const v = Object.values(carga); const mx = Math.max(...v); return mx ? (mx - Math.min(...v))/mx*100 : 0; };
  let trocas = 0;
  for (let it = 0; it < 8 && spread() > S.config.limiteSorteio; it++){
    const ids = Object.keys(carga).sort((a, b) => carga[b] - carga[a]);
    const mx = ids[0], mn = ids[ids.length-1];
    const cand = novos.filter(x => x.membroId === mx && membro(mn).idade >= (ativ(x.atividadeId).idadeMin || 0) && !membro(mn).ontem.includes(x.atividadeId))
      .filter(x => Math.abs((carga[mx] - ativ(x.atividadeId).peso) - (carga[mn] + ativ(x.atividadeId).peso)) < carga[mx] - carga[mn])
      .sort((a, b) => ativ(b.atividadeId).peso - ativ(a.atividadeId).peso);
    if (!cand.length) break;
    const t = cand[0]; const p = ativ(t.atividadeId).peso;
    carga[mx] -= p; carga[mn] += p; t.membroId = mn; trocas++;
  }
  S.atribuicoes = S.atribuicoes.filter(a => a.data !== dia).concat(manter, novos);
  S.sorteio = {semente, quando:Date.now(), carga, diff: spread(), repeticoesEvitadas, trocas};
  if (!silencioso) audit('sorteio', `Novo sorteio balanceado (semente ${semente}): diferença de ${fmt(spread())}% entre a maior e a menor carga.`);
}

function enviarRegistro(){
  const d = ui.draft; const atr = S.atribuicoes.find(a => a.id === d.atribId); const atv = ativ(atr.atividadeId); const m = membro(atr.membroId);
  const r = novoRegistro(atr, {antes:d.antes || null, depois:d.depois || null}, d.obs || '');
  audit('registro', `${m.nome} registrou “${atv.nome}” (${EVID[r.evid].label.toLowerCase()}).`, m.id);
  ui.sheet = null; ui.draft = null;
  if (r.auto){
    aplicarAprovacao(r, ESTRELA_PADRAO, true);
    toast('Missão concluída!', `${atv.nome} rendeu +${fmt(r.pontos)} XP.`, 'check');
  } else {
    atr.status = 'pendente';
    toast('Missão enviada!', `${quemAvalia(r)} vai avaliar “${atv.nome}”. +${fmt(calcPts(atv.peso, r.evid))} quando aprovada.`, 'camera');
  }
  save();
}
function aplicarAprovacao(r, estrelas, auto){
  const q = multEstrelas(estrelas);
  const atv = ativ(r.atividadeId); const m = membro(r.membroId); const atr = S.atribuicoes.find(a => a.id === r.atribId);
  const pts = calcPts(atv.peso, r.evid, q);
  const nAntes = nivel(m.xp).n;
  r.status = 'aprovado'; r.pontos = pts; r.quali = q; r.estrelas = estrelas; r.avaliadoPor = auto ? 'sistema' : ui.who; r.avaliadoEm = Date.now();
  if (atr) atr.status = 'aprovado';
  m.xp += pts; m.pts += pts; m.cred += pts; m.tarefasTemp++; m.pesoTemp += atv.peso; m.tarefasSemana++;
  m.semanas[m.semanas.length-1] += pts;
  if (S.meta.membros.includes(m.id)) S.meta.contrib[m.id] = (S.meta.contrib[m.id] || 0) + pts;
  movimento(m.id, `${atv.nome} aprovado`, {xp:pts, cred:pts});
  audit('aprovação', `${auto ? 'Sistema' : membro(ui.who).nome} aprovou “${atv.nome}” de ${m.nome}: +${fmt(pts)}${auto ? '' : ` (${estrelas} ${estrelas === 1 ? 'estrela' : 'estrelas'})`}.`);
  const nDepois = nivel(m.xp).n;
  if (nDepois > nAntes) setTimeout(() => toast('Nível novo!', `${m.nome} chegou ao nível ${nDepois}.`, 'xp'), 2200);
}
function aprovar(id){
  const r = S.registros.find(x => x.id === id);
  aplicarAprovacao(r, ui.estrelas[id] || ESTRELA_PADRAO, false);
  toast('Missão aprovada!', `${ativ(r.atividadeId).nome} rendeu +${fmt(r.pontos)} XP para ${membro(r.membroId).nome}.`, 'check');
  save();
}
function rejeitar(id, motivo){
  const r = S.registros.find(x => x.id === id); const atr = S.atribuicoes.find(a => a.id === r.atribId);
  const final = r.status === 'contestado';
  r.status = 'rejeitado'; r.motivo = motivo; r.final = final; if (atr) atr.status = 'rejeitado';
  audit('rejeição', `${membro(ui.who).nome} ${final ? 'manteve a rejeição de' : 'rejeitou'} “${ativ(r.atividadeId).nome}” de ${membro(r.membroId).nome}: ${motivo}`);
  ui.sheet = null; toast('Registro devolvido', `${membro(r.membroId).nome} vê o motivo e pode ${final ? 'refazer' : 'contestar ou refazer'}.`, 'ampulheta'); save();
}
function contestar(id, texto){
  const r = S.registros.find(x => x.id === id); const atr = S.atribuicoes.find(a => a.id === r.atribId);
  r.status = 'contestado'; r.contestacao = texto; r.avaliador = null; if (atr) atr.status = 'contestado';
  audit('contestação', `${membro(r.membroId).nome} contestou a rejeição de “${ativ(r.atividadeId).nome}”.`, r.membroId);
  ui.sheet = null; toast('Contestação enviada', `${quemAvalia(r)} decide em última instância.`, 'ampulheta'); save();
}
function resgatesNaSemana(recId){ return S.resgates.filter(x => x.recompensaId === recId && isoLocal(new Date(x.quando)) >= S.semana).length; }
function bloqueioResgate(m, rec){
  if (m.cred < rec.custo) return `faltam ${fmt(rec.custo - m.cred)}`;
  if (rec.estoque != null && resgatesNaSemana(rec.id) >= rec.estoque) return 'esgotado na semana';
  if (rec.minutos && m.minutos + m.usadoHoje + rec.minutos > S.config.limiteDiario) return `limite de ${S.config.limiteDiario/60} h/dia`;
  return null;
}
function resgatar(recId){
  const m = membro(ui.who); const rec = S.recompensas.find(r => r.id === recId);
  const b = bloqueioResgate(m, rec); if (b){ toast('Ainda não', b, 'bau'); return; }
  m.cred -= rec.custo;
  if (rec.minutos) m.minutos += rec.minutos;
  S.resgates.push({id:uid('rs'), recompensaId:rec.id, membroId:m.id, custo:rec.custo, quando:Date.now(), status: rec.minutos ? 'liberado' : 'aguardando entrega'});
  movimento(m.id, 'Resgate: ' + rec.nome, {cred:-rec.custo});
  audit('resgate', `${m.nome} resgatou “${rec.nome}” por ${rec.custo} créditos.`, m.id);
  ui.sheet = null;
  if (rec.minutos) toast('Tempo liberado!', `+${rec.minutos} min no computador. Seu XP continua igual.`, 'tela');
  else toast('Tesouro resgatado!', `${membro(rec.por)?.nome || 'Os admins'} vai entregar “${rec.nome}”.`, 'bau');
  save();
}
function converter(){
  const m = membro(ui.who); const {credBloco, minBloco, limiteDiario} = S.config;
  if (m.cred < credBloco){ toast('Ainda não', `Você precisa de ${credBloco} créditos.`, 'moeda'); return; }
  if (m.minutos + m.usadoHoje + minBloco > limiteDiario){ toast('Limite do dia', `O máximo é ${limiteDiario/60} h por dia (RN10).`, 'tela'); return; }
  m.cred -= credBloco; m.minutos += minBloco;
  movimento(m.id, `Troca por ${minBloco} min de computador`, {cred:-credBloco});
  audit('tempo', `${m.nome} trocou ${credBloco} créditos por ${minBloco} min.`, m.id);
  toast('Tempo liberado!', `+${minBloco} min de computador.`, 'tela'); save();
}
function naoFeita(atrId){
  const a = S.atribuicoes.find(x => x.id === atrId); const atv = ativ(a.atividadeId); const m = membro(a.membroId);
  a.status = 'nao_feita'; m.streak = 0;
  const outros = S.membros.filter(x => x.id !== m.id && x.idade >= (atv.idadeMin || 0)).sort((p, q) => (S.sorteio.carga[p.id] || 0) - (S.sorteio.carga[q.id] || 0));
  if (outros[0]){
    S.atribuicoes.push({id:uid('at'), atividadeId:a.atividadeId, membroId:outros[0].id, data:hoje(), status:'a_fazer', rotulo:'redistribuída', origem:'redistribuida'});
    S.sorteio.carga[outros[0].id] = (S.sorteio.carga[outros[0].id] || 0) + atv.peso;
    audit('redistribuição', `“${atv.nome}” passou de ${m.nome} para ${outros[0].nome}, que fica com os pontos. Sem dívida (RN07).`);
    toast('Missão redistribuída', `${outros[0].nome} assume “${atv.nome}” e fica com os pontos.`, 'd20');
  }
  save();
}
function pagarMesada(mid, metodo){
  const m = membro(mid); const valor = mesadaDevida(m);
  S.pagamentos.push({id:uid('pg'), membroId:mid, semana:S.semana, valor, metodo, quando:Date.now(), por:ui.who});
  audit('mesada', `${membro(ui.who).nome} registrou a mesada de ${m.nome} (${brl(valor)}) como paga via ${metodo}.`);

/* ============ computador simulado (1 s = 1 min) ============ */
function pcStart(){
  const m = membro(ui.who); if (m.minutos <= 0) return;
  ui.pc = {run:true, soft:0, owner:m.id};
  audit('tempo', `Computador de ${m.nome} desbloqueado com ${m.minutos} min de saldo.`, m.id);
  clearInterval(pcTimer); pcTimer = setInterval(pcTick, 1000); render();
}
function pcStop(msg){
  if (!ui.pc.run) return;
  clearInterval(pcTimer); pcTimer = null;
  const m = membro(ui.pc.owner);
  ui.pc = {run:false, soft:0, owner:null};
  if (m) audit('tempo', `Computador de ${m.nome} ${msg || 'desligado'}.`, m.id);
  save();
}
function pcTick(){
  const m = membro(ui.pc.owner); if (!m){ pcStop(); return; }
  if (ui.pc.soft > 0){
    ui.pc.soft--;
    if (ui.pc.soft === 0){ pcStop('bloqueado: saldo esgotado'); toast('Tempo esgotado', 'O computador foi bloqueado. Conclua uma missão para liberar mais.', 'tela'); return; }
  } else {
    m.minutos = Math.max(0, m.minutos - 1); m.usadoHoje++;
    if (m.minutos === 0) ui.pc.soft = 5;
  }
  if (ui.tab === 'tela' && !ui.sheet) render();
}

/* ---------- Evolução + ranking por equipe ---------- */
function vEvolucao(m){
  const sem = m.semanas; const n = sem.length; const atual = sem[n-1], ant = sem[n-2] || 0;
  const diff = atual - ant; const melhor = Math.max(...sem.slice(0, -1));
  const escala = Math.ceil(Math.max(10, ...sem) / 20) * 20;
  const inicioSem = i => addDias(S.semana, -7*(n-1-i));
  const chart = `<div class="chart" role="img" aria-label="Pontos por semana nas últimas ${n} semanas">
      <div class="grid" style="bottom:50%"><span>${escala/2}</span></div><div class="grid" style="bottom:100%"><span>${escala}</span></div>
      ${sem.map((v, i) => `<div class="colb ${i === n-1 ? 'now' : ''}" tabindex="0"><i style="height:${Math.max(2, v/escala*100)}%"></i>${i >= n-2 ? `<span class="v" style="bottom:${v/escala*100}%">${fmt(v)}</span>` : ''}<span class="tip">Semana de ${dataCurta(inicioSem(i))}: ${fmt(v)} pontos</span></div>`).join('')}
    </div>
    <div class="xl">${sem.map((v, i) => `<span>${i === n-1 ? 'esta' : dataCurta(inicioSem(i))}</span>`).join('')}</div>`;
  const eqs = S.equipes.map(e => { const ms = S.membros.filter(x => x.equipe === e.id); return {e, ms, tot: ms.reduce((s, x) => s + x.pts, 0), tar: ms.reduce((s, x) => s + x.tarefasTemp, 0)}; })
    .filter(x => x.ms.length).sort((a, b) => b.tot - a.tot || b.tar - a.tar);
  const dias = Math.max(0, diasEntre(hoje(), S.temporada.fim));
  const metaTot = S.meta.membros.reduce((s, id) => s + (S.meta.contrib[id] || 0), 0);
  return `<div class="cq-section-label" style="margin-top:4px">Sua evolução <span>você contra você mesmo</span></div>
  <div class="card px-frame">
    <div class="split"><span><span class="evo-big">${fmt(atual)}</span> <span class="cap">pontos nesta semana</span></span>
      <span class="${diff >= 0 ? 'green' : 'muted'}" style="font-weight:600">${diff >= 0 ? `+${fmt(diff)} sobre a semana passada` : `faltam ${fmt(-diff)} para igualar a semana passada`}</span></div>
    ${chart}
    <p class="cap">${atual > melhor ? 'Esta já é a sua melhor semana!' : `Sua melhor semana teve ${fmt(melhor)} pontos.`} A semana fecha no domingo.</p>
  </div>
  <div class="tiles">
    <div class="tile px-frame"><span>Sequência</span><b>${m.streak}d</b></div>
    <div class="tile px-frame"><span>Missões</span><b>${m.tarefasSemana}</b></div>
    <div class="tile px-frame"><span>Nível</span><b>${nivel(m.xp).n}</b></div>
  </div>
  <div class="cq-section-label">Ranking de equipes <span>${dias} dias de temporada</span></div>
  ${eqs.length > 1 ? `<div class="px-frame" style="margin:4px">${eqs.map((x, i) => `<div class="cq-rank${i === 0 ? ' cq-rank-top1' : ''}${x.e.id === m.equipe ? ' cq-rank-me' : ''}"><span class="cq-rank-pos cq-num">${i+1}</span><span class="team-crest" style="background:${x.e.cor}" aria-hidden="true">${esc(x.e.nome.split(' ').pop()[0])}</span><span class="cq-rank-name">${esc(x.e.nome)}${x.e.id === m.equipe ? '<em> (sua)</em>' : ''}<br><span class="cap">${esc(nomes(x.ms.map(y => y.nome)))}</span></span><span class="cq-rank-lvl">${x.tar} missões</span><span class="cq-rank-pts cq-num">${fmt(x.tot)}</span></div>`).join('')}</div>
  <div class="cq-dialog"><div class="cq-dialog-icon">${icon('trofeu', 48)}</div><div class="cq-dialog-text"><div class="cq-dialog-title">Prêmio da temporada</div><div>A equipe vencedora ${esc(eqs[0].e.premio.toLowerCase())}.</div></div><span class="cq-dialog-next" aria-hidden="true">▼</span></div>
  <p class="cap" style="margin:0 4px">O ranking soma os pontos de temporada de cada equipe e não compara pessoas.</p>`
  : `<div class="card px-frame"><b>${esc(eqs[0]?.e.nome || 'Equipe')}</b><p class="formula">Com uma equipe só, o ranking vira a posição em relação à meta: ${fmt(metaTot)} de ${fmt(S.meta.alvo)} pontos.</p></div>`}`;

/* ---------- Meta coletiva (GoalProgress) ---------- */
function vMeta(m){
  const g = S.meta; const ms = g.membros.map(membro).filter(Boolean);
  const tot = ms.reduce((s, x) => s + (g.contrib[x.id] || 0), 0);
  const min = Math.round(g.alvo * g.minPct / 100);
  const dias = Math.max(0, diasEntre(hoje(), g.prazo)); const decorr = diasEntre(g.inicio, hoje());
  const falta = Math.max(0, g.alvo - tot);
  const ritmo = dias ? Math.ceil(falta / dias) : falta;
  const ritmoAtual = decorr ? Math.round(tot / decorr) : 0;
  const cores = ['cq-m0','cq-m1','cq-m2','cq-m3'];
  const fora = S.membros.filter(x => !g.membros.includes(x.id));
  return `<div class="cq-section-label" style="margin-top:4px">Meta coletiva <span>${dias} dias restantes</span></div>
  <div class="cq-goal px-frame" style="margin:4px">
    <div class="cq-goal-head">${icon('bau', 36)}<div><div class="cq-goal-title">${esc(g.nome)}</div><div class="cq-goal-sub"><span class="cq-num">${fmt(tot)}/${fmt(g.alvo)}</span> pontos · até ${dataCurta(g.prazo)}</div></div></div>
    <div class="cq-goal-track" role="progressbar" aria-valuemin="0" aria-valuemax="${g.alvo}" aria-valuenow="${tot}" aria-label="${esc(g.nome)}">${ms.map((x, i) => `<i class="${cores[i % 4]}" style="width:${Math.min(100, (g.contrib[x.id] || 0) / g.alvo * 100)}%"></i>`).join('')}</div>
    <ul class="cq-goal-members">${ms.map((x, i) => { const c = g.contrib[x.id] || 0; const ok = c >= min; return `<li><i class="${cores[i % 4]}" aria-hidden="true"></i><span>${esc(x.nome)}</span><span class="cq-num">${fmt(c)}</span><span class="${ok ? 'cq-goal-ok' : 'cq-goal-falta'}">${ok ? 'mínimo ok' : `faltam ${fmt(min - c)}`}</span></li>`; }).join('')}</ul>
  </div>
  <div class="card px-frame">
    <p class="formula">Cada um precisa de <b>${fmt(min)}</b> pontos (${g.minPct}% do alvo) para o prêmio sair. Faltam <b>${fmt(falta)}</b> no total: <b>${ritmo} por dia</b> a partir de hoje. Ritmo atual: ${ritmoAtual} por dia${ritmoAtual >= ritmo ? ', dentro do prazo.' : ', abaixo do necessário.'}</p>

    </div>`)}

  ${panel('Para decidir', 'd20', `<ol class="dots" style="padding-left:20px">
      <li><b>Aprovação na demo?</b> A <code>ideia.md</code> tira do protótipo de 40 minutos; o diagrama mantém “quem atribuiu aprova”. Aqui ela ficou, com um toque.</li>
      <li><b>Mesada fixa ou por pontos?</b> As duas estão no Admin.</li>
      <li><b>Equipes de tamanhos diferentes:</b> soma, como pede a ideia, ou média?</li>
      <li><b>Meta coletiva só dos filhos?</b> O componente GoalProgress aceita até 4 membros; a família tem 5. Aqui a meta é dos filhos, como no exemplo da ideia.</li>
      <li><b>Plano gratuito:</b> a ideia fala em freemium; o que fica no grátis e o que justifica os R$ 19,90?</li>
    </ol>`, 'red')}`;
}

/* ============ eventos ============ */
function toast(t, x, ic){ ui.toast = {t, x, ic}; clearTimeout(toastTimer); render(); toastTimer = setTimeout(() => { ui.toast = null; render(); }, 3000); }
function setWho(id){ pcStop('desligado ao trocar de usuário'); ui.who = id; ui.sheet = null; ui.onb = null; }
const errSheet = t => { const e = document.getElementById('sheet-err'); if (e) e.textContent = t; };

const ACT = {
  who: d => { setWho(d.id); render(); },
  tab: d => { if (d.tab !== 'tela') pcStop('desligado ao sair da tela'); ui.tab = d.tab; render(); },
  perfil: () => { ui.sheet = {t:'perfil'}; render(); },
  tema: () => { ui.tema = ui.tema === 'noite' ? 'dia' : 'noite'; try { localStorage.setItem(KEY + ':tema', ui.tema); } catch(e){} render(); },
  'modo-app': () => { ui.sheet = null; location.hash = 'app'; },
  'sair-app': () => { ui.sheet = null; history.replaceState(null, '', location.pathname + location.search); render(); },
  reset: () => { pcStop(); try { localStorage.removeItem(KEY); } catch(e){} seed(); ui.who = 'm3'; ui.tab = 'hoje'; ui.onb = null; ui.sheet = null; ui.vis = {}; toast('Exemplo restaurado', 'A família da Ana voltou ao começo do dia.', 'casa'); },
  onb: () => { pcStop(); ui.onb = onbPadrao('familia'); ui.sheet = null; render(); },
  'onb-tipo': d => { ui.onb = onbPadrao(d.v); render(); },
  'onb-sair': () => { ui.onb = null; render(); },
  'onb-voltar': () => { ui.onb.passo--; render(); },
  'onb-avancar': () => {
    const o = ui.onb;
    if (o.passo === 1 && !o.familia.trim()) return errSheet('Dê um nome para o grupo.');
    if (o.passo === 2 && o.atv.filter(a => a.on).length < 3) return errSheet('Escolha pelo menos 3 missões.');
    if (o.passo < 3){ o.passo++; render(); return; }
    const ms = o.membros.filter(m => m.nome.trim());
    if (o.tipo === 'casal'){ if (ms.length !== 2) return errSheet('No casal, cadastre as duas pessoas.'); ms.forEach(m => { m.admin = true; }); }
    else {
      if (ms.length < 2) return errSheet('Cadastre pelo menos 2 pessoas.');
      if (!ms.some(m => m.admin && +m.idade >= 18)) return errSheet('Marque pelo menos um adulto como admin.');
    }
    seed({tipo:o.tipo, familia:o.familia, atividades:o.atv.filter(a => a.on), membros:ms, historico:o.historico, criadaAgora:true});
    ui.onb = null; ui.who = admins()[0].id; ui.tab = 'admin'; ui.vis = {};
    toast('Guilda criada!', `${S.familia.nome} está pronta e as missões do dia foram sorteadas.`, 'casa');
  },
  go: d => {
    const bruno = S.tipo === 'familia' ? S.membros[2] : null;
    ui.onb = null; ui.sheet = null;
    if (!bruno){ toast('Roteiro da família', 'Clique em Restaurar exemplo para voltar à família da Ana.', 'casa'); return; }
    if (d.go === 'p1'){ setWho(bruno.id); ui.tab = 'hoje'; }
    if (d.go === 'p2'){
      const atb = S.atribuicoes.find(a => a.membroId === bruno.id && a.atividadeId === 'banheiro');
      const r = atb && atb.registroId && S.registros.find(x => x.id === atb.registroId);
      if (r && r.status === 'pendente'){ setWho(admins()[0].id); ui.tab = 'admin'; } else { setWho(bruno.id); ui.tab = 'hoje'; }
    }
    if (d.go === 'p3'){ setWho(bruno.id); ui.tab = 'evolucao'; }
    if (d.go === 'p4'){ setWho(bruno.id); ui.tab = 'premios'; }
    if (d.go === 'p5'){ setWho(bruno.id); ui.tab = 'meta'; }
    render();
    if (window.matchMedia('(max-width:900px)').matches) document.getElementById('stage').scrollIntoView({behavior:'smooth'});
  },
  registrar: d => { ui.draft = {atribId:d.id, antes:null, depois:null, obs:''}; ui.sheet = {t:'registrar'}; render(); },
  'foto-exemplo': d => { const a = S.atribuicoes.find(x => x.id === ui.draft.atribId); ui.draft[d.k] = fotoExemplo(d.k, ativ(a.atividadeId).nome, d.k === 'antes' ? 41 : 42); render(); },
  'limpar-foto': d => { ui.draft[d.k] = null; render(); },
  enviar: () => enviarRegistro(),
  fechar: () => { ui.sheet = null; ui.draft = null; render(); },
  aprovar: d => aprovar(d.id),
  estrela: d => { ui.estrelas[d.id] = +d.n; render(); },
  rejeitar: d => { ui.sheet = {t:'rejeitar', id:d.id}; render(); },
  'motivo-rapido': d => { const t = document.getElementById('motivo'); if (t) t.value = d.v; },
  'confirmar-rejeicao': d => { const v = document.getElementById('motivo').value.trim(); if (!v) return errSheet('Escreva o motivo da rejeição.'); rejeitar(d.id, v); },
  contestar: d => { ui.sheet = {t:'contestar', id:d.id}; render(); },
  'confirmar-contestacao': d => { const v = document.getElementById('cont').value.trim(); if (!v) return errSheet('Explique por que a missão foi feita.'); contestar(d.id, v); },
  resgatar: d => { ui.sheet = {t:'resgatar', id:d.id}; render(); },
  'confirmar-resgate': d => resgatar(d.id),
  converter: () => converter(),
  'pc-start': () => pcStart(),
  'pc-stop': () => { pcStop('desligado com saldo guardado'); render(); },
  sortear: () => { sortear(Math.floor(Math.random()*1e6)+1); save(); toast('Sorteio feito!', `Diferença de carga de ${fmt(S.sorteio.diff)}% entre os membros.`, 'd20'); },
  'nao-feita': d => naoFeita(d.id),
  pagar: d => pagarMesada(d.id, d.m),
  'mesada-modo': d => { S.config.mesada.modo = d.v; audit('mesada', `${membro(ui.who).nome} mudou a mesada para ${d.v === 'fixo' ? 'valor fixo' : 'pontos'}.`); save(); render(); },
  emergencia: () => { ui.sheet = {t:'emergencia'}; render(); },
  'confirmar-emergencia': () => {
    const mid = document.getElementById('em-m').value, min = +document.getElementById('em-min').value, j = document.getElementById('em-j').value.trim(), pin = document.getElementById('em-pin').value;
    if (!j) return errSheet('A justificativa é obrigatória (RN11).');
    if (pin !== S.config.pin) return errSheet('PIN incorreto.');
    const m = membro(mid); m.minutos += min;
    audit('emergência', `${membro(ui.who).nome} liberou ${min} min para ${m.nome} com PIN: ${j}.`);
    ui.sheet = null; save(); toast('Tempo liberado!', `+${min} min de emergência para ${m.nome}.`, 'tela');
  },
  atividades: () => { ui.sheet = {t:'atividades'}; render(); },
  'nova-tarefa': () => { ui.sheet = {t:'nova-tarefa'}; render(); },
  'salvar-tarefa': () => {
    const nome = document.getElementById('nt-nome').value.trim();
    if (!nome) return errSheet('Dê um nome para a missão.');
    const para = document.getElementById('nt-para').value, peso = +document.getElementById('nt-peso').value, evid = document.getElementById('nt-evid').value;
    const a = {id:uid('a'), nome, icone:'vassoura', peso, freq:'Avulsa', evid, valid:'admin', idadeMin:0, prazo:'hoje', ativo:false, avulsa:true};
    S.atividades.push(a);
    S.atribuicoes.push({id:uid('at'), atividadeId:a.id, membroId:para, data:hoje(), status:'a_fazer', origem:'avulsa', criadoPor:ui.who});
    audit('missão', `${membro(ui.who).nome} criou “${nome}” (peso ${fmt(peso)}) para ${para === ui.who ? 'si' : membro(para).nome}.`);
    ui.sheet = null; save(); toast('Missão criada!', para === ui.who ? `“${nome}” entrou na sua lista.` : `“${nome}” foi para ${membro(para).nome}. Você aprova a conclusão.`, 'vassoura');
  },
  'nova-recompensa': () => { ui.sheet = {t:'recompensa'}; render(); },
  'salvar-recompensa': () => {
    const nome = document.getElementById('nr-nome').value.trim(); const custo = +document.getElementById('nr-custo').value;
    if (!nome || !(custo > 0)) return errSheet('Preencha nome e custo.');
    const est = +document.getElementById('nr-est').value; const min = +document.getElementById('nr-min').value;
    S.recompensas.push({id:uid('r'), nome, icone: min > 0 ? 'tela' : 'bau', custo, horizonte:document.getElementById('nr-h').value, estoque: est > 0 ? est : null, minutos: min > 0 ? min : undefined, por:ui.who});
    audit('recompensa', `${membro(ui.who).nome} ofereceu “${nome}” (${custo} créditos).`);
    ui.sheet = null; save(); toast('Tesouro novo!', `“${nome}” entrou no Tesouro por ${custo} créditos.`, 'bau');
  },
  'fechar-fundo': (d, el, ev) => { if (ev.target === el){ ui.sheet = null; ui.draft = null; render(); } }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'fechar-fundo') ev.preventDefault();
  fn(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.draft && ui.draft) ui.draft[t.dataset.draft] = t.value;
  if (t.dataset.onb === 'familia') ui.onb.familia = t.value;
  if (t.dataset.onbM != null && t.type !== 'checkbox' && t.tagName !== 'SELECT') ui.onb.membros[+t.dataset.onbM][t.dataset.k] = t.value;
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.file && ui.draft && t.files && t.files[0]){
    try { ui.draft[t.dataset.file] = await lerFoto(t.files[0]); } catch(e){ toast('Foto não lida', 'Não consegui abrir essa imagem. Tente outra.', 'camera'); return; }
    render(); return;
  }
  if (t.dataset.cfg){ S.config[t.dataset.cfg] = +t.value; audit('regra', `${membro(ui.who).nome} alterou “${t.dataset.cfg}”.`); save(); render(); return; }
  if (t.dataset.peso){ const a = ativ(t.dataset.peso); const antes = a.peso; a.peso = +t.value; audit('peso', `${membro(ui.who).nome} mudou o peso de “${a.nome}” de ${fmt(antes)} para ${fmt(a.peso)}.`); save(); render(); return; }
  if (t.dataset.ativo){ const a = ativ(t.dataset.ativo); a.ativo = t.checked; sortear(Math.floor(Math.random()*1e6)+1); save(); render(); return; }
  if (t.dataset.onb === 'historico'){ ui.onb.historico = t.checked; return; }
  if (t.dataset.onbAtv != null){ const a = ui.onb.atv[+t.dataset.onbAtv]; a[t.dataset.k] = t.type === 'checkbox' ? t.checked : (t.dataset.k === 'peso' ? +t.value : t.value); return; }
  if (t.dataset.onbM != null){ const m = ui.onb.membros[+t.dataset.onbM]; m[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; return; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheet){ ui.sheet = null; ui.draft = null; render(); } });
window.addEventListener('hashchange', () => { ui.sheet = null; render(); });

/* ============ início ============ */
S = load();
if (!S) seed();
else if (S.dia !== hoje()){
  S.membros.forEach(m => { m.ontem = S.atribuicoes.filter(a => a.membroId === m.id && a.data === S.dia && !(ativ(a.atividadeId) || {}).pessoal).map(a => a.atividadeId); m.usadoHoje = 0; });
  if (segunda() !== S.semana){ S.membros.forEach(m => { m.semanas = m.semanas.slice(1).concat(0); m.tarefasSemana = 0; m.atribSemana = 0; }); S.semana = segunda(); }
  S.dia = hoje(); sortear(Math.floor(Math.random()*1e6)+1); save();
}
try { ui.tema = localStorage.getItem(KEY + ':tema') || 'noite'; } catch(e){}
ui.who = (S.membros[2] || S.membros[0]).id; ui.tab = 'hoje';
render();
</script>
</body>
</html>
